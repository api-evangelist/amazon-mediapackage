                    requested. This can be helpful for Live to VOD harvesting, or for temporarily disabling origination

                    '
                  enum:
                  - ALLOW
                  - DENY
                  type: string
                startoverWindowSeconds:
                  description: 'Maximum duration (in seconds) of content to retain for startover playback.

                    If not specified, startover playback will be disabled for the OriginEndpoint.

                    '
                  type: integer
                timeDelaySeconds:
                  description: 'Amount of delay (in seconds) to enforce on the playback of live content.

                    If not specified, there will be no time delay in effect for the OriginEndpoint.

                    '
                  type: integer
                whitelist:
                  description: A list of source IP CIDR blocks that will be allowed to access the OriginEndpoint.
                  type: array
                  items:
                    $ref: '#/components/schemas/__string'
      summary: Amazon MediaPackage Update Origin Endpoint
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Origin Endpoints
components:
  schemas:
    CmafEncryption:
      required:
      - SpekeKeyProvider
      type: object
      properties:
        ConstantInitializationVector:
          allOf:
          - $ref: '#/components/schemas/__string'
          - xml:
              name: constantInitializationVector
            description: An optional 128-bit, 16-byte hex value represented by a 32-character string, used in conjunction with the key for encrypting blocks. If you don't specify a value, then MediaPackage creates the constant initialization vector (IV).
        EncryptionMethod:
          allOf:
          - $ref: '#/components/schemas/CmafEncryptionMethod'
          - xml:
              name: encryptionMethod
        KeyRotationIntervalSeconds:
          allOf:
          - $ref: '#/components/schemas/__integer'
