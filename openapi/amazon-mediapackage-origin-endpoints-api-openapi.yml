                $ref: '#/components/schemas/TooManyRequestsException'
              examples:
                DeleteOriginEndpoint485Example:
                  summary: Default DeleteOriginEndpoint 485 response
                  x-microcks-default: true
                  value: {}
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the OriginEndpoint to delete.
        schema:
          type: string
      summary: Amazon MediaPackage Delete Origin Endpoint
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Origin Endpoints
    get:
      operationId: DescribeOriginEndpoint
      description: Gets details about an existing OriginEndpoint.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeOriginEndpointResponse'
              examples:
                DescribeOriginEndpoint200Example:
                  summary: Default DescribeOriginEndpoint 200 response
                  x-microcks-default: true
                  value:
                    Arn: arn:aws:service:us-east-1:123456789012:resource/example
                    Authorization: example-value
                    ChannelId: id-abc123
                    CmafPackage: example-value
                    CreatedAt: example-value
        '480':
          description: UnprocessableEntityException
          content:
            application/json:
              schema:
